server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── WebSocket proxy → agent-service ──────────────────────────────────────
    # All /ws/* traffic is forwarded to the agent container.
    # This means the browser only needs one port (80) for both the UI and chat.
    location /ws/ {
        proxy_pass         http://agent:8100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 300s;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite adds content hashes to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html so the browser always fetches the latest
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
