# ── Local multi-container stack ───────────────────────────────────────────────
#
# Starts all four services in Docker so you can test the full stack locally
# before deploying to AWS.
#
# Usage:
#   docker compose up --build        # build images and start
#   docker compose up -d             # start in background
#   docker compose logs -f agent     # tail agent logs
#   docker compose down              # stop and remove containers
#
# Service map:
#   travel-api   :9000   FastAPI travel data service
#   mcp-server   :8200   MCP server (HTTP/SSE transport)
#   agent        :8100   Agent WebSocket API
#   ui           :8080   React UI (nginx)
#
# IMPORTANT — inter-service URLs:
#   Inside Docker, services talk to each other by *service name*, not localhost.
#   The overrides below wire these up automatically:
#     agent → mcp-server   via MCP_SERVER_URL=http://mcp-server:8200/sse
#     agent → travel-api   via TRAVEL_API_URL=http://travel-api:9000
#     mcp-server → travel-api   via TRAVEL_API_URL=http://travel-api:9000
#   Your agent/.env can still use localhost URLs for the non-Docker workflow.
#
# AWS credentials:
#   Copy agent/.env.example → agent/.env and fill in your credentials.
#   docker-compose mounts it with env_file so secrets never go into the image.

services:

  # ── Travel Data API ──────────────────────────────────────────────────────────
  travel-api:
    build:
      context: ./travel-api
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MCP Server ───────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: ./mcp-server
    ports:
      - "8200:8200"
    env_file:
      - ./agent/.env
    environment:
      # Force HTTP/SSE transport (also set in Dockerfile, explicit here for clarity)
      MCP_TRANSPORT: http
      # Inside Docker, reach travel-api by service name
      TRAVEL_API_URL: http://travel-api:9000
    depends_on:
      travel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/sse')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Agent WebSocket API ──────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
    ports:
      - "8100:8100"
    env_file:
      - ./agent/.env
    environment:
      # Inside Docker, reach other services by service name
      MCP_TRANSPORT: http
      MCP_SERVER_URL: http://mcp-server:8200/sse
      TRAVEL_API_URL: http://travel-api:9000
    depends_on:
      mcp-server:
        condition: service_healthy

  # ── React UI (nginx) ─────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      args:
        # Inside Docker the browser still runs on the host machine,
        # so ws://localhost:8100 is correct (agent port is mapped to host).
        VITE_WS_URL: ws://localhost:8100/ws/chat
    ports:
      - "8080:80"
    depends_on:
      - agent
