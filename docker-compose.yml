# ── Local multi-container stack ───────────────────────────────────────────────
#
# Starts all four services in Docker so you can test the full stack locally
# before deploying to AWS.
#
# Usage:
#   docker compose up --build        # build images and start
#   docker compose up -d             # start in background
#   docker compose logs -f agent     # tail agent logs
#   docker compose down              # stop and remove containers
#
# Service map:
#   travel-api   :9000   FastAPI travel data service
#   mcp-server   :8200   MCP server (streamable-http transport)
#   agent        :8100   Agent WebSocket API
#   ui           :80     React UI (nginx) — proxies /ws/ to agent
#
# IMPORTANT — inter-service URLs:
#   Inside Docker, services talk to each other by *service name*, not localhost.
#   The overrides below wire these up automatically:
#     agent → mcp-server   via MCP_SERVER_URL=http://mcp-server:8200/mcp
#     agent → travel-api   via TRAVEL_API_URL=http://travel-api:9000
#   Your agent/.env can still use localhost URLs for the non-Docker workflow.
#
# AWS credentials:
#   Copy agent/.env.example → agent/.env and fill in your credentials.
#   docker-compose mounts it with env_file so secrets never go into the image.

services:

  # ── Travel Data API ──────────────────────────────────────────────────────────
  travel-api:
    build:
      context: ./travel-api
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MCP Server ───────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: ./mcp-server
    ports:
      - "8200:8200"
    env_file:
      - ./agent/.env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8200"
      TRAVEL_API_URL: http://travel-api:9000
    depends_on:
      travel-api:
        condition: service_healthy

  # ── Agent WebSocket API ──────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
    ports:
      - "8100:8100"
    env_file:
      - ./agent/.env
    environment:
      MCP_TRANSPORT: http
      MCP_SERVER_URL: http://mcp-server:8200/mcp
      TRAVEL_API_URL: http://travel-api:9000
    depends_on:
      mcp-server:
        condition: service_started

  # ── React UI (nginx) ─────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      args:
        # nginx proxies /ws/ → agent:8100, so the browser only needs port 80.
        # For EC2: set VITE_WS_URL=ws://<EC2_PUBLIC_IP>/ws/chat before running.
        # Default (localhost) works for local Docker development.
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost/ws/chat}
    ports:
      - "80:80"
    depends_on:
      - agent
